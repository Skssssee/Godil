<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GoFile Links</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: #0f172a;
  color: white;
  font-family: Arial, sans-serif;
}
.header {
  padding: 15px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
button {
  background: #2563eb;
  border: none;
  padding: 12px 18px;
  color: white;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
}
button:hover {
  background: #1d4ed8;
}
.note {
  padding: 15px;
  color: #cbd5f5;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="header">
  <button onclick="openGoFile('DVBn14')">Folder 1</button>
  <button onclick="openGoFile('XXXXXX')">Folder 2</button>
  <button onclick="openGoFile('YYYYYY')">Folder 3</button>
</div>

<div class="note">
⚠ GoFile does NOT support embed or API anymore. Links open directly.
</div>

<script>
function openGoFile(id) {
  window.open("https://gofile.io/d/" + id, "_blank");
}
</script>

</body>
</html>
