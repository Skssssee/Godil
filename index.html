<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GoFile Multi Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: #0f172a;
  color: #fff;
  font-family: Arial, sans-serif;
}

.header {
  padding: 10px;
  background: #020617;
  display: flex;
  gap: 10px;
  overflow-x: auto;
}

button {
  background: #2563eb;
  border: none;
  color: white;
  padding: 10px 16px;
  border-radius: 8px;
  cursor: pointer;
  white-space: nowrap;
}

button:hover {
  background: #1d4ed8;
}

iframe {
  width: 100%;
  height: calc(100vh - 60px);
  border: none;
  background: black;
}
</style>
</head>

<body>

<div class="header">
  <button onclick="loadFolder('DVBn14')">Folder 1</button>
  <button onclick="loadFolder('PASTE_ID_2')">Folder 2</button>
  <button onclick="loadFolder('PASTE_ID_3')">Folder 3</button>
</div>

<iframe
  id="player"
  allow="autoplay; fullscreen"
  allowfullscreen>
</iframe>

<script>
function loadFolder(id) {
  const iframe = document.getElementById("player");

  // Force reload every time (important for mobile Chrome)
  iframe.src = "";
  setTimeout(() => {
    iframe.src = "https://gofile.io/embed/" + id + "?autoplay=1";
  }, 100);
}

// Auto-load first folder AFTER page load
window.onload = () => {
  loadFolder("DVBn14");
};
</script>

</body>
</html>
