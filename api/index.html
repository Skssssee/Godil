<script>
async function loadFile() {
  const result = document.getElementById("result");
  const link = document.getElementById("link").value.trim();

  result.innerHTML = "Loading...";

  try {
    if (!link.includes("/d/")) {
      throw "Invalid GoFile link";
    }

    const id = link.split("/d/")[1];

    const res = await fetch(`/api/gofile?id=${id}`);
    const data = await res.json();

    if (data.status !== "ok") {
      throw JSON.stringify(data);
    }

    const file = Object.values(data.data.contents)[0];

    result.innerHTML = `<h3>${file.name}</h3>`;

    if (file.mimetype.startsWith("video")) {
      result.innerHTML += `<video controls autoplay src="${file.link}"></video>`;
    } else if (file.mimetype.startsWith("audio")) {
      result.innerHTML += `<audio controls autoplay src="${file.link}"></audio>`;
    } else {
      result.innerHTML += `<a href="${file.link}" target="_blank">Download</a>`;
    }

  } catch (err) {
    result.innerHTML = "❌ " + err;
    console.error(err);
  }
}
</script>
